theme: jekyll-theme-cayman
title: Horizon Daily
description: AI-curated daily digest of tech, AI, finance and crypto news
baseurl: ""
url: "https://zengdw.github.io"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
permalink: /:title.html
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
